<script>
(function(){
  var audio=document.getElementById('totw-audio'),btn=document.getElementById('totw-btn'),icon=document.getElementById('totw-icon'),fill=document.getElementById('totw-fill'),dot=document.getElementById('totw-dot'),track=document.getElementById('totw-track'),on=false;
  var PLAY='<path d="M1 1L11 7L1 13V1Z" fill="#111"/>',PAUSE='<rect x="1" y="1" width="3.5" height="12" fill="#111"/><rect x="7.5" y="1" width="3.5" height="12" fill="#111"/>';
  function setPos(v){fill.style.width=v+'%';dot.style.left=v+'%';}
  btn.addEventListener('click',function(){if(on){audio.pause();icon.innerHTML=PLAY;on=false;}else{audio.play().catch(function(){});icon.innerHTML=PAUSE;on=true;}});
  audio.addEventListener('timeupdate',function(){if(audio.duration)setPos(audio.currentTime/audio.duration*100);});
  audio.addEventListener('ended',function(){icon.innerHTML=PLAY;on=false;setPos(0);});
  track.addEventListener('click',function(e){var r=track.getBoundingClientRect(),v=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));setPos(v*100);if(audio.duration)audio.currentTime=v*audio.duration;if(!on){audio.play().catch(function(){});icon.innerHTML=PAUSE;on=true;}});
})();
